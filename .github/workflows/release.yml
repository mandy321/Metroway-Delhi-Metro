name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Metroway ${{ github.ref_name }} – Delhi Metro Companion"
          body: |
            ## 🚇 Metroway – Delhi Metro Companion ${{ github.ref_name }}

            ### 📱 Installation
            1. Download `Metroway-Delhi-Metro-${{ github.ref_name }}.apk` below
            2. On your Android phone: **Settings → Security → Install unknown apps** → enable for your browser or file manager
            3. Open the downloaded APK and tap **Install**

            ### ✨ What's New
            - 🗺️ **Interactive Map** – metro network map with highlighted route between stations
            - 📍 **Station Markers** – distinct icons for start, destination & interchange stations
            - 👥 **Live Crowd Estimates** – crowd levels based on current time of day
            - 📐 **Optimized UI** – more vertical space for route details, compact header
            - 🌙 **Dark Mode** – consistent dark theme throughout the app
            - 📋 **Route Tabs** – Timeline, Fare, Exits & Outages tabs redesigned for clarity

            ### 📋 Requirements
            - Android 7.0 (API 24) or higher
            - Architecture: ARM64-v8a (all modern Android phones)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
