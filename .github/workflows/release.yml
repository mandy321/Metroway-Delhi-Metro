name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Rename APK with version tag
        run: |
          mkdir -p release-artifacts
          VERSION="${{ github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             release-artifacts/Metroway-Delhi-Metro-${VERSION}.apk
          echo "APK_PATH=mobile/release-artifacts/Metroway-Delhi-Metro-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=Metroway-Delhi-Metro-${VERSION}.apk" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          cat << 'EOF' > release_notes.md
          ## Metroway – Delhi Metro Companion ${{ github.ref_name }}

          ### 📱 Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" in your Android settings
          3. Open the downloaded APK to install

          ### ✨ What's New
          - Interactive metro network map with route highlighting
          - Start, destination, and interchange station markers on the map
          - Live crowd level estimates based on time of day
          - Optimized UI with more space for route details
          - Dark mode support throughout the app
          - Timeline, Fare, Exits, and Outages tabs for each route

          ### 📋 Requirements
          - Android 7.0 (API 24) or higher
          - Architecture: ARM64 (modern devices)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Metroway ${{ github.ref_name }} – Delhi Metro Companion"
          body_path: mobile/release_notes.md
          draft: false
          prerelease: false
          files: mobile/release-artifacts/Metroway-Delhi-Metro-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
